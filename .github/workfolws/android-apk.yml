- name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f "./gradle.bat" ]; then
            echo "Gradle wrapper configuration is incomplete for Linux."
            exit 1
          elif [ -f "./app/build.gradle.kts" ] || [ -f "./app/build.gradle" ]; then
            gradle --no-daemon assembleDebug
          else
            echo "Android app module or Gradle wrapper was not found."
            echo "Check that app/build.gradle.kts or app/build.gradle exists."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAI-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
